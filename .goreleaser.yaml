# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

builds:
- id: kubectl
  main: ./cmd/kubectl
  flags:
  - -trimpath
  # Match hack/lib/version.sh kube::version::ldflags (both packages).
  ldflags: &kubectl_kube_ldflags
  - -s -w
  - "-X=k8s.io/component-base/version.buildDate={{ .Date }}"
  - "-X=k8s.io/component-base/version.gitCommit={{ .FullCommit }}"
  - "-X=k8s.io/component-base/version.gitTreeState={{ .GitTreeState }}"
  - "-X=k8s.io/component-base/version.gitVersion={{ if .Tag }}{{ .Tag }}{{ else }}v{{ .Version }}{{ end }}"
  - "-X=k8s.io/component-base/version.gitMajor={{ .Major }}"
  - "-X=k8s.io/component-base/version.gitMinor={{ .Minor }}"
  - "-X=k8s.io/client-go/pkg/version.buildDate={{ .Date }}"
  - "-X=k8s.io/client-go/pkg/version.gitCommit={{ .FullCommit }}"
  - "-X=k8s.io/client-go/pkg/version.gitTreeState={{ .GitTreeState }}"
  - "-X=k8s.io/client-go/pkg/version.gitVersion={{ if .Tag }}{{ .Tag }}{{ else }}v{{ .Version }}{{ end }}"
  - "-X=k8s.io/client-go/pkg/version.gitMajor={{ .Major }}"
  - "-X=k8s.io/client-go/pkg/version.gitMinor={{ .Minor }}"
  env:
  - CGO_ENABLED=0
  targets:
  - darwin_arm64_v8.4 # Apple M1
  - darwin_arm64_v8.6 # Apple M2/M3
  - darwin_arm64_v9.2 # Apple M4
  - linux_amd64
  - linux_amd64_v2
  - linux_amd64_v3
  - linux_amd64_v4
  - linux_arm_v6
  - linux_arm_v7
  - linux_arm64
  - linux_arm64_v8.0
  - linux_arm64_v8.2 # Graviton2 / Raspberry Pi 5
  - linux_arm64_v8.4 # Graviton3
  - linux_arm64_v9.0 # Graviton4
  - linux_arm64_v9.2
  - windows_amd64
  - windows_amd64_v2
  - windows_amd64_v3
  - windows_amd64_v4
  - windows_arm64
  binary: >-
    kubectl-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    {{- if .Arm }}
      {{- .Arm }}
    {{- else if and .Arm64 (ne .Arm64 "v8.0") }}
      {{- .Arm64 }}
    {{- else if and .Amd64 (ne .Amd64 "v1") }}
      {{- .Amd64 }}
    {{- end }}
  no_unique_dist_dir: true

# Single darwin_arm64 build for Homebrew Cask (one archive per GOOS/GOARCH).
- id: kubectl-cask
  main: ./cmd/kubectl
  flags:
  - -trimpath
  ldflags: *kubectl_kube_ldflags
  env:
  - CGO_ENABLED=0
  targets:
  - darwin_arm64
  # Plain name so the Homebrew cask installs /opt/homebrew/bin/kubectl (see homebrew_casks.binaries).
  # The main kubectl build keeps versioned filenames for multi-arch GitHub release assets.
  binary: kubectl
  no_unique_dist_dir: true

archives:
- id: kubectl
  name_template: >-
    kubectl-v{{ .Version }}-{{ .Os }}-{{ .Arch }}
    {{- if .Arm }}
      {{- .Arm }}
    {{- else if and .Arm64 (ne .Arm64 "v8.0") }}
      {{- .Arm64 }}
    {{- else if and .Amd64 (ne .Amd64 "v1") }}
      {{- .Amd64 }}
    {{- end }}
  formats:
  - binary
  ids:
  - kubectl

- id: kubectl-cask
  name_template: >-
    kubectl-v{{ .Version }}-{{ .Os }}-{{ .Arch }}
    {{- if .Arm }}
      {{- .Arm }}
    {{- else if and .Arm64 (ne .Arm64 "v8.0") }}
      {{- .Arm64 }}
    {{- else if and .Amd64 (ne .Amd64 "v1") }}
      {{- .Amd64 }}
    {{- end }}
  formats:
  - binary
  ids:
  - kubectl-cask

checksum:
  name_template: checksums.txt

release:
  github:
    owner: sylr
    name: kubernetes
  ids:
  - kubectl
  - kubectl-cask

homebrew_casks:
- name: kubectl
  ids:
  - kubectl-cask
  binaries:
  - kubectl
  # cobra already invokes the `completion` subcommand; extra args produced
  # `kubectl completion completion <shell>` and broke install-time generation.
  #
  # Must match the kubectl-cask archive artifact basename (see archives kubectl-cask
  # name_template). Homebrew runs this before linking to /opt/homebrew/bin, so `kubectl`
  # is not on PATH yet — a bare executable name would exit 127.
  generate_completions_from_executable:
    executable: kubectl-v{{ .Version }}-darwin-arm64
    shell_parameter_format: cobra
    base_name: kubectl
    shells:
    - bash
    - zsh
    - fish
  caveats: |
    If you have Homebrew's kubernetes-cli formula installed, uninstall or unlink it
    first so this cask can install /opt/homebrew/bin/kubectl:

      brew uninstall kubernetes-cli

    (Linking is skipped when that path is already owned by the formula.)
  commit_msg_template: Brew cask update for {{ .ProjectName }} version {{ .Tag }}
  directory: Casks
  homepage: https://github.com/sylr/kubernetes
  description: kubectl from the sylr/kubernetes release builds
  url:
    verified: github.com/sylr/kubernetes/
  repository:
    owner: sylr
    name: homebrew-tap
  hooks:
    # preflight runs before `generate_completions_from_executable` and `binary` (see Homebrew
    # Cask::Installer#install). Postflight xattr was too late: exec of the quarantined binary
    # for completions is SIGKILL'd by macOS before quarantine could be stripped.
    pre:
      install: |
        if OS.mac?
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
        end
